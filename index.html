<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스킨십 영어표현 대시보드</title>
<style>
  * { box-sizing: border-box; }
  body { font-family:'Malgun Gothic',sans-serif; background:linear-gradient(135deg,#a8edea 0%,#fed6e3 100%); margin:0; padding:20px; }
  .container { max-width:800px; margin:0 auto; }
  h1 { text-align:center; color:#5b3a8e; font-size:1.8em; margin-bottom:5px; }
  .subtitle { text-align:center; color:#7a5ea8; margin-bottom:20px; }
  .section-title { font-weight:bold; color:#5b3a8e; font-size:1.2em; margin:25px 0 12px; }
  .vocab-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .vocab-item { background:#fff5f8; border:2px solid #ffb6c1; border-radius:12px; padding:10px; text-align:center; }
  .vocab-eng { font-weight:bold; color:#d6336c; }
  .vocab-kor { color:#555; font-size:0.9em; margin-top:4px; }
  .dialogue-card { background:white; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,0.1); border-left:6px solid #74c0fc; }
  .dhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .dtitle { font-weight:bold; color:#1971c2; }
  .play-btn { background:#e7f5ff; border:2px solid #1971c2; color:#1971c2; border-radius:20px; padding:6px 14px; cursor:pointer; font-size:0.9em; font-weight:bold; font-family:inherit; }
  .play-btn:hover { background:#d0ebff; }
  .play-btn.playing { background:#1971c2; color:white; }
  .speech { display:flex; gap:8px; margin-bottom:8px; padding:4px; border-radius:10px; transition:background 0.2s; }
  .speech.active { background:#fff9db; }
  .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; flex-shrink:0; }
  .avatar.a { background:#ff8787; } .avatar.b { background:#4dabf7; }
  .bubble { background:#f1f3f5; border-radius:12px; padding:8px 12px; flex:1; }
  .bubble .eng { font-weight:bold; font-size:0.95em; }
  .bubble .kor { color:#868e96; font-size:0.85em; margin-top:3px; }
  .hl { background:#ffec99; padding:0 3px; border-radius:3px; }
  .quiz-box { background:white; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  .quiz-q { font-weight:bold; margin-bottom:10px; }
  .quiz-options { display:flex; flex-wrap:wrap; gap:8px; }
  .quiz-btn { background:#e7f5ff; border:2px solid #74c0fc; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:1em; font-family:inherit; }
  .quiz-btn:hover { background:#d0ebff; }
  .quiz-btn.correct { background:#ffe3e3; border-color:#e03131; color:#e03131; font-weight:bold; }
  .quiz-result { margin-top:8px; font-weight:bold; min-height:20px; }
  .redcircle { display:inline-block; width:16px; height:16px; border:3px solid #e03131; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .retry-btn { background:#fff3bf; border:2px solid #f59f00; color:#a05a00; border-radius:20px; padding:8px 18px; cursor:pointer; font-weight:bold; font-family:inherit; display:block; margin:10px auto 0; }
  #finalMessage { display:none; text-align:center; margin-top:16px; font-size:1.2em; font-weight:bold; color:#37b24d; }
  #confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; display:none; z-index:9999; }
</style>
</head>
<body>
<div class="container">
  <h1>🤗 스킨십 영어표현 대시보드 🤗</h1>
  <p class="subtitle">중학생을 위한 쉬운 영어 표현 배우기</p>

  <div class="section-title">📚 오늘의 단어</div>
  <div class="vocab-grid">
    <div class="vocab-item"><div class="vocab-eng">touchy-feely</div><div class="vocab-kor">스킨십을 좋아하는</div></div>
    <div class="vocab-item"><div class="vocab-eng">a hugger</div><div class="vocab-kor">포옹 좋아하는 사람</div></div>
    <div class="vocab-item"><div class="vocab-eng">to cuddle</div><div class="vocab-kor">껴안다</div></div>
    <div class="vocab-item"><div class="vocab-eng">affectionate</div><div class="vocab-kor">다정한</div></div>
  </div>

  <div class="section-title">💬 대화로 배워보기</div>
  <div id="dialogues"></div>

  <div class="section-title">✏️ 퀴즈 챌린지</div>
  <div id="quizzes"></div>
  <button class="retry-btn" id="retryBtn">🔄 새 문제로 다시 풀기</button>
  <div id="finalMessage"></div>
</div>
<canvas id="confetti"></canvas>

<script>
/* ================= 대화 데이터 ================= */
/* who = 대화 순서(아바타 색), g = 화자 성별(목소리). 둘은 별개다. */
const dialogues = [
  { title:"새로운 남자친구 이야기", lines:[
    {name:"Sarah", eng:"Tell me about your boyfriend! What's he like?", kor:"네 남자친구 얘기 좀 해줘! 어떤 사람이야?", who:"a", g:"f"},
    {name:"Jessica", eng:"He's really sweet! He's super touchy-feely. He always wants to hold hands.", kor:"정말 다정해! 스킨십을 정말 좋아해. 항상 손을 잡고 싶어해.", who:"b", g:"f", hl:"touchy-feely"},
    {name:"Sarah", eng:"Aww, that sounds nice!", kor:"아, 좋다!", who:"a", g:"f"}
  ]},
  { title:"우리 아빠 이야기", lines:[
    {name:"Mike", eng:"Your dad hugs everyone at parties!", kor:"너희 아빠는 파티에서 모든 사람을 안아주시네!", who:"a", g:"m"},
    {name:"Lisa", eng:"Yeah, he's definitely a hugger! He hugs everyone, even strangers.", kor:"응, 우리 아빠는 진짜 포옹을 좋아하셔! 낯선 사람도 안아주셔.", who:"b", g:"f", hl:"a hugger"},
    {name:"Mike", eng:"My dad prefers a handshake instead.", kor:"우리 아빠는 대신 악수하는 걸 더 좋아하셔.", who:"a", g:"m"}
  ]},
  { title:"우리 강아지 이야기", lines:[
    {name:"Tom", eng:"Your dog is so friendly!", kor:"네 강아지 진짜 친근하다!", who:"a", g:"m"},
    {name:"Maria", eng:"Thanks! Max loves to cuddle with everyone.", kor:"고마워! 맥스는 모든 사람이랑 껴안는 걸 좋아해.", who:"b", g:"f", hl:"to cuddle"},
    {name:"Tom", eng:"My cat is the opposite. She's not very affectionate.", kor:"우리 고양이는 반대야. 별로 다정하지 않아.", who:"a", g:"m", hl:"affectionate"}
  ]}
];

/* ================= TTS 목소리 설정 ================= */
let voiceMale = null, voiceFemale = null, voiceFemale2 = null;

/* 주의: /male/ 는 "Female" 에도 매치된다. 여성 여부를 먼저 판정한 뒤
   남은 것 중에서 남성을 고르고, male 은 \b 로 단어 경계를 잡는다. */
const FEMALE_RE = /female|woman|girl|google us english|zira|samantha|karen|moira|tessa|susan|allison|ava|joanna|serena|fiona|victoria|catherine|hazel|heera|linda|eva|jenny|aria|michelle|emma|nicky|kate|salli|kimberly|kendra|ivy|amy|raveena|nicole|laura|sonia|libby|maisie|natasha|clara|molly|shelley/i;
const MALE_RE = /\bmale\b|\bman\b|\bboy\b|david|daniel|alex|fred|mark|george|james|guy|oliver|arthur|ryan|thomas|aaron|rishi|brian|christopher|eric|roger|steffan|andrew|tony|liam|gary|jason|kevin|william|matthew|john|paul|richard|robert|michael|ralph|albert|bruce/i;

function pickVoices() {
  const all = window.speechSynthesis.getVoices();
  const en = all.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if (en.length === 0) return;

  const females = en.filter(v => FEMALE_RE.test(v.name));
  const males = en.filter(v => !FEMALE_RE.test(v.name) && MALE_RE.test(v.name));

  // 남성 목소리가 없으면 여성으로 분류되지 않은 아무 목소리, 그것도 없으면 낮은 피치로만 구분
  voiceMale = males[0] || en.filter(v => !FEMALE_RE.test(v.name))[0] || en[0];
  voiceFemale = females[0] || en.filter(v => v !== voiceMale)[0] || en[0];
  voiceFemale2 = females[1] || voiceFemale;
}
pickVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined) {
  window.speechSynthesis.onvoiceschanged = pickVoices;
}

function speakLine(line) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(line.eng);
    u.lang = 'en-US';
    if (line.g === 'm') {
      if (voiceMale) u.voice = voiceMale;
      u.pitch = 0.7; u.rate = 0.88;
    } else {
      // 한 대화에 여성이 둘이면(Sarah/Jessica) 순서 슬롯으로 목소리를 나눈다
      const v = (line.who === 'b') ? voiceFemale2 : voiceFemale;
      if (v) u.voice = v;
      u.pitch = (line.who === 'b') ? 1.12 : 1.28; u.rate = 0.9;
    }
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

/* ================= 대화 카드 그리기 ================= */
const dContainer = document.getElementById('dialogues');

dialogues.forEach(d => {
  const card = document.createElement('div');
  card.className = 'dialogue-card';

  const head = document.createElement('div');
  head.className = 'dhead';
  const title = document.createElement('div');
  title.className = 'dtitle';
  title.textContent = d.title;
  const playBtn = document.createElement('button');
  playBtn.className = 'play-btn';
  playBtn.textContent = '🔊 대화 듣기';
  head.appendChild(title);
  head.appendChild(playBtn);
  card.appendChild(head);

  const rowEls = [];

  d.lines.forEach(line => {
    const row = document.createElement('div');
    row.className = 'speech';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + line.who;
    avatar.textContent = line.name.charAt(0);
    row.appendChild(avatar);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    let engHtml = line.name + ': ' + line.eng;
    if (line.hl) engHtml = engHtml.replace(line.hl, '<span class="hl">' + line.hl + '</span>');
    const engP = document.createElement('div');
    engP.className = 'eng';
    engP.innerHTML = engHtml;
    bubble.appendChild(engP);
    const korP = document.createElement('div');
    korP.className = 'kor';
    korP.textContent = line.kor;
    bubble.appendChild(korP);
    row.appendChild(bubble);
    card.appendChild(row);
    rowEls.push(row);
  });

  let playing = false;

  playBtn.addEventListener('click', async () => {
    if (playing) {
      window.speechSynthesis.cancel();
      playing = false;
      playBtn.textContent = '🔊 대화 듣기';
      playBtn.classList.remove('playing');
      rowEls.forEach(r => r.classList.remove('active'));
      return;
    }
    window.speechSynthesis.cancel();
    playing = true;
    playBtn.textContent = '⏸ 멈추기';
    playBtn.classList.add('playing');

    for (let i = 0; i < d.lines.length; i++) {
      if (!playing) break;
      rowEls.forEach(r => r.classList.remove('active'));
      rowEls[i].classList.add('active');
      await speakLine(d.lines[i]);
      await new Promise(r => setTimeout(r, 350));
    }

    playing = false;
    playBtn.textContent = '🔊 대화 듣기';
    playBtn.classList.remove('playing');
    rowEls.forEach(r => r.classList.remove('active'));
  });

  dContainer.appendChild(card);
});

/* ================= 퀴즈 (정답 위치 랜덤) ================= */
const quizData = [
  { q:"\"그는 포옹하는 걸 정말 좋아해\"를 영어로 하면?",
    answer:"He's a hugger.", wrong:["He likes skin-ship.","He's a hand phone."] },
  { q:"\"그녀는 스킨십을 편하게 좋아해\"를 영어로 하면?",
    answer:"She's touchy-feely.", wrong:["She's a consent.","She likes cunning."] },
  { q:"\"우리 강아지는 껴안는 걸 좋아해\"를 영어로 하면?",
    answer:"My dog loves to cuddle.", wrong:["My dog likes one-shot.","My dog is eye shopping."] },
  { q:"\"우리 가족은 스킨십을 별로 안 해\"를 영어로 하면?",
    answer:"We're not very touchy-feely.", wrong:["We're not very hand phone.","We don't like service."] },
  { q:"\"그는 정말 다정한 사람이야\"를 영어로 하면?",
    answer:"He's a very affectionate person.", wrong:["He's a very cunning person.","He's a very meeting person."] },
  { q:"\"고양이가 내 옆에서 껴안고 있어\"를 영어로 하면?",
    answer:"My cat is cuddling next to me.", wrong:["My cat is one-shotting next to me.","My cat is skin-shipping next to me."] }
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const quizzesDiv = document.getElementById('quizzes');
let correctCount = 0;
let totalQuestions = 3;

function buildQuiz() {
  quizzesDiv.innerHTML = '';
  document.getElementById('finalMessage').style.display = 'none';
  correctCount = 0;

  const picked = shuffle(quizData).slice(0, totalQuestions);

  picked.forEach((quiz, qIndex) => {
    const options = shuffle([quiz.answer].concat(quiz.wrong));
    let solved = false;

    const box = document.createElement('div');
    box.className = 'quiz-box';
    const qEl = document.createElement('div');
    qEl.className = 'quiz-q';
    qEl.textContent = (qIndex + 1) + '. ' + quiz.q;
    box.appendChild(qEl);

    const optsEl = document.createElement('div');
    optsEl.className = 'quiz-options';
    const resultEl = document.createElement('div');
    resultEl.className = 'quiz-result';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        if (solved) return;
        if (opt === quiz.answer) {
          btn.classList.add('correct');
          btn.innerHTML = '<span class="redcircle"></span>' + opt;
          Array.from(optsEl.children).forEach(b => b.disabled = true);
          resultEl.textContent = '🔴 정답이에요! 잘했어요!';
          resultEl.style.color = '#37b24d';
          solved = true;
          correctCount++;
          checkAllSolved();
        } else {
          resultEl.textContent = '❌ 다시 한번 생각해볼까요? 다른 답을 골라보세요!';
          resultEl.style.color = '#e03131';
        }
      });
      optsEl.appendChild(btn);
    });

    box.appendChild(optsEl);
    box.appendChild(resultEl);
    quizzesDiv.appendChild(box);
  });
}

function checkAllSolved() {
  if (correctCount === totalQuestions) {
    const finalMsg = document.getElementById('finalMessage');
    finalMsg.style.display = 'block';
    finalMsg.textContent = '🎉🎊 축하해요! ' + totalQuestions + '문제 모두 맞췄어요! 최고예요! 🎊🎉';
    launchConfetti();
  }
}

document.getElementById('retryBtn').addEventListener('click', () => {
  buildQuiz();
  document.getElementById('retryBtn').scrollIntoView({ behavior:'smooth', block:'center' });
});

buildQuiz();

/* ================= 폭죽 ================= */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#ff6b9d','#74c0fc','#ffd43b','#63e6be','#e599f7','#ff8787'];
  const pieces = [];
  for (let i=0;i<150;i++){
    pieces.push({x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.5, size:5+Math.random()*6, color:colors[Math.floor(Math.random()*colors.length)], speedY:2+Math.random()*3, speedX:-2+Math.random()*4, rotation:Math.random()*360, rotationSpeed:-5+Math.random()*10});
  }
  let frame=0; const maxFrames=260;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.speedX; p.y+=p.speedY; p.rotation+=p.rotationSpeed;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rotation*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    frame++;
    if (frame<maxFrames) requestAnimationFrame(animate);
    else canvas.style.display='none';
  }
  animate();
}
</script>
</body>
</html>
